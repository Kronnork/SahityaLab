[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sahityalab"
version = "0.1.0"
description = "A reproducible Python workbench for literature reviews, bibliometrics, manuscript feedback, and journal responses."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "SahityaLab Contributors"}]
keywords = ["systematic literature review", "bibliometrics", "scientometrics", "research", "manuscript", "PRISMA", "peer review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pandas>=2.2",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
bibliometrics = ["pybibx>=5.9.5"]
latex = ["pylatexenc>=2.10"]
bibtex = ["bibtexparser>=1.4"]
ai = ["openai>=1.30"]
excel = ["openpyxl>=3.1"]
all = ["pybibx>=5.9.5", "pylatexenc>=2.10", "bibtexparser>=1.4", "openai>=1.30", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
sahitya = "sahityalab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sahityalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
